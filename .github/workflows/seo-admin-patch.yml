name: Apply SEO admin/page patch
on:
  push:
    branches: [pixelpopgpt]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixelpopgpt
          fetch-depth: 0
      - name: Patch
        shell: python
        run: |
          from pathlib import Path

          def repl(p, old, new, count=1):
              f=Path(p); t=f.read_text(encoding='utf-8'); n=t.count(old)
              if n != count: raise SystemExit(f'{p}: anchor count {n}, expected {count}: {old[:100]!r}')
              f.write_text(t.replace(old,new,count), encoding='utf-8')

          p='src/routes/manage-admin.tsx'
          repl(p,'  metatags: string;\n};','  metatags: string;\n  slug: string;\n  seo_title: string;\n  seo_description: string;\n  canonical_url: string;\n  content_type: string;\n  language: string;\n  release_date: string;\n  imdb_id: string;\n  indexable: boolean;\n};')
          repl(p,'  metatags: "",\n};','  metatags: "",\n  slug: "",\n  seo_title: "",\n  seo_description: "",\n  canonical_url: "",\n  content_type: "movie",\n  language: "si",\n  release_date: "",\n  imdb_id: "",\n  indexable: true,\n};')
          repl(p,'            } else if (header === "season" || header === "episode") {\n              obj[header] = value === null || value === "" ? null : Number(value);\n            } else {','            } else if (header === "season" || header === "episode") {\n              obj[header] = value === null || value === "" ? null : Number(value);\n            } else if (header === "indexable") {\n              obj[header] = value === null || value === "" ? true : ["true", "1", "yes", "y"].includes(String(value).toLowerCase());\n            } else {')
          repl(p,'          title,download_link,image_url,genre,description,rating,year,season,episode,metatags,telegram_link','          title,download_link,image_url,genre,description,rating,year,season,episode,metatags,telegram_link,slug,seo_title,seo_description,canonical_url,content_type,language,release_date,imdb_id,indexable')
          repl(p,'    set("description", overview);\n\n    setTmdbResults([]);','    set("description", overview);\n    set("content_type", type === "tv" ? "series" : "movie");\n    set("language", "si");\n    set("release_date", type === "movie" ? (item.release_date || "") : (item.first_air_date || ""));\n\n    setTmdbResults([]);')
          repl(p,'  const buildPayload = () => {\n    const num = (v: string) => (v.trim() === "" ? null : Number.isNaN(Number(v)) ? v.trim() : Number(v));','  const slugifySeo = (value: string) => value.normalize("NFKD").replace(/[\\u0300-\\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "").slice(0, 160);\n\n  const buildPayload = () => {\n    const num = (v: string) => (v.trim() === "" ? null : Number.isNaN(Number(v)) ? v.trim() : Number(v));')
          repl(p,'      episode: e,\n      metatags: form.metatags.trim() || null,\n    };\n  };','      episode: e,\n      metatags: form.metatags.trim() || null,\n      slug: form.slug.trim() || null,\n      seo_title: form.seo_title.trim() || null,\n      seo_description: form.seo_description.trim() || null,\n      canonical_url: form.canonical_url.trim() || null,\n      content_type: form.content_type.trim() || (mediaMode === "tv" ? "series" : "movie"),\n      language: form.language.trim() || "si",\n      release_date: form.release_date.trim() || null,\n      imdb_id: form.imdb_id.trim() || null,\n      indexable: form.indexable,\n    };\n  };')
          repl(p,'    const savedRow = dbData?.[0];\n\n    // Broadcast to Telegram if selected','    const savedRow = dbData?.[0];\n\n    if (savedRow?.id) {\n      const finalSlug = form.slug.trim() || `${slugifySeo(form.title)}-${savedRow.id}`;\n      const { error: slugError } = await supabase.from(SUBTITLES_TABLE).update({ slug: finalSlug }).eq("id", savedRow.id);\n      if (slugError) { setStatus({ type: "error", msg: `Saved, but SEO slug update failed: ${slugError.message}` }); return; }\n      savedRow.slug = finalSlug;\n    }\n\n    // Broadcast to Telegram if selected')
          repl(p,'      metatags: r.metatags ?? "",\n    });','      metatags: r.metatags ?? "",\n      slug: r.slug ?? "",\n      seo_title: r.seo_title ?? "",\n      seo_description: r.seo_description ?? "",\n      canonical_url: r.canonical_url ?? "",\n      content_type: r.content_type ?? (isTv ? "series" : "movie"),\n      language: r.language ?? "si",\n      release_date: r.release_date ?? "",\n      imdb_id: r.imdb_id ?? "",\n      indexable: r.indexable !== false,\n    });')
          marker='''                  <label className="sm:col-span-2 block">\n                    <span className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">Description</span>\n                    <textarea\n                      value={form.description}\n                      onChange={(e) => set("description", e.target.value)}\n                      rows={3}\n                      placeholder="Movie or Episode synopsis…"\n                      className="mt-1.5 w-full px-4 py-2.5 rounded-xl bg-muted/60 border border-border focus:border-primary focus:outline-none text-sm resize-y"\n                    />\n                  </label>\n'''
          seo=marker+'''\n                  <div className="sm:col-span-2 rounded-2xl border border-primary/20 bg-primary/5 p-4 space-y-4">\n                    <div className="flex items-center justify-between gap-3">\n                      <div><h3 className="text-xs font-bold uppercase tracking-wide text-primary">SEO Controls</h3><p className="text-[11px] text-muted-foreground mt-0.5">Manual fields override generated metadata.</p></div>\n                      <label className="inline-flex items-center gap-2 text-xs font-semibold cursor-pointer"><input type="checkbox" checked={form.indexable} onChange={(e)=>set("indexable",e.target.checked)} className="w-4 h-4 rounded border-border text-primary" /> Indexable</label>\n                    </div>\n                    <div className="grid sm:grid-cols-2 gap-3">\n                      <Field label="SEO Slug" value={form.slug} onChange={(v)=>set("slug",v)} placeholder="e.g. inception-2010" />\n                      <Field label="SEO Title" value={form.seo_title} onChange={(v)=>set("seo_title",v)} placeholder="Custom search title" />\n                      <Field label="Canonical URL" value={form.canonical_url} onChange={(v)=>set("canonical_url",v)} placeholder="https://pixelpoplk.pages.dev/content/..." />\n                      <Field label="Content Type" value={form.content_type} onChange={(v)=>set("content_type",v)} placeholder="movie or series" />\n                      <Field label="Language" value={form.language} onChange={(v)=>set("language",v)} placeholder="si" />\n                      <Field label="Release Date" value={form.release_date} onChange={(v)=>set("release_date",v)} placeholder="YYYY-MM-DD" />\n                      <Field label="IMDb ID" value={form.imdb_id} onChange={(v)=>set("imdb_id",v)} placeholder="tt1234567" />\n                    </div>\n                    <label className="block"><span className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">SEO Description</span><textarea value={form.seo_description} onChange={(e)=>set("seo_description",e.target.value)} rows={3} maxLength={320} placeholder="Unique, useful search snippet for this page…" className="mt-1.5 w-full px-4 py-2.5 rounded-xl bg-muted/60 border border-border focus:border-primary focus:outline-none text-sm resize-y" /></label>\n                  </div>\n'''
          repl(p,marker,seo)

          p='src/routes/content.$id.tsx'
          repl(p,'const SAFE_COLUMNS = "id, title, year, image_url, genre, rating, description, season, episode, created_at, updated_at";','const SAFE_COLUMNS = "id, title, year, image_url, genre, rating, description, season, episode, created_at, updated_at, slug, seo_title, seo_description, canonical_url, content_type, language, release_date, imdb_id, indexable";')
          repl(p,'    const titleText = `${s.title} (${year}) Sinhala Subtitle | Download Movie Subtitles | PixelPopLK`;\n    const descText = s.description\n      ? s.description.slice(0, 160)\n      : `Download Sinhala subtitles for ${s.title} (${year}). High-quality Sinhala sub file synced for official release. Fast & secure on PixelPopLK.`;\n    const customMeta = (s as any).metatags;\n    const keywordText = customMeta\n      ? `${s.title} Sinhala Subtitle, ${customMeta}`\n      : `${s.title} Sinhala Subtitle, Download ${s.title} Subtitle, PixelPopLK, Sinhala Subtitles, Movie Subtitles`;\n    const canonicalUrl = `${BASE_URL}/content/${s.id}`;','    const titleText = s.seo_title?.trim() || `${s.title} (${year}) Sinhala Subtitle | Download Movie Subtitles | PixelPopLK`;\n    const descText = s.seo_description?.trim() || (s.description ? s.description.slice(0, 160) : `Download Sinhala subtitles for ${s.title} (${year}). High-quality Sinhala subtitle file synced for the listed release on PixelPopLK.`);\n    const canonicalUrl = s.canonical_url?.trim() || `${BASE_URL}/content/${s.slug || s.id}`;\n    const indexable = s.indexable !== false;')
          repl(p,'        { name: "keywords", content: keywordText },\n        { name: "robots", content: "index, follow" },','        { name: "robots", content: indexable ? "index, follow" : "noindex, follow" },')
          repl(p,'  const description = s1e1?.description ?? null;\n  const titleText = `${item.showName} Sinhala Subtitles | TV Series Download | PixelPopLK`;\n  const descText = description\n    ? description.slice(0, 160)\n    : `Download Sinhala subtitles for TV Series ${item.showName} (${year}). Latest seasons and episodes available on PixelPopLK.`;\n  const customMeta = item.episodes.map((e) => (e as any).metatags).find(Boolean);\n  const keywordText = customMeta\n    ? `${item.showName} Sinhala Subtitles, ${customMeta}`\n    : `${item.showName} Sinhala Subtitles, Sinhala Subtitles TV Series, ${item.showName} Sinhala Subtitles TV Series, PixelPopLK`;\n  const canonicalUrl = `${BASE_URL}/content/${item.id}`;','  const description = s1e1?.description ?? null;\n  const seoSource = s1e1 || item.episodes[0];\n  const titleText = seoSource?.seo_title?.trim() || `${item.showName} Sinhala Subtitles | TV Series Download | PixelPopLK`;\n  const descText = seoSource?.seo_description?.trim() || (description ? description.slice(0, 160) : `Download Sinhala subtitles for TV Series ${item.showName} (${year}). Latest seasons and episodes available on PixelPopLK.`);\n  const canonicalUrl = seoSource?.canonical_url?.trim() || `${BASE_URL}/content/${seoSource?.slug || item.id}`;\n  const indexable = seoSource?.indexable !== false;')
          repl(p,'          <RelatedContentSection currentItem={item} />\n\n          {/* 🟢 SEO Tags Cloud */}\n          <SeoTagsCloud title={titleName} year={yearVal ? String(yearVal) : undefined} isSeries={isSeries} />\n          \n          <CommentsSection','          <RelatedContentSection currentItem={item} />\n          \n          <CommentsSection')
          repl(p,'''    ...(s.rating\n      ? {\n          "aggregateRating": {\n            "@type": "AggregateRating",\n            "ratingValue": String(s.rating),\n            "bestRating": "10",\n            "worstRating": "1",\n            "ratingCount": "1",\n            "description": "IMDb rating sourced from public data"\n          }\n        }\n      : {}),\n''','')

          p='src/routes/episode.$id.tsx'
          repl(p,'const SAFE_COLUMNS = "id, title, year, image_url, genre, rating, description, season, episode, created_at, updated_at";','const SAFE_COLUMNS = "id, title, year, image_url, genre, rating, description, season, episode, created_at, updated_at, slug, seo_title, seo_description, canonical_url, content_type, language, release_date, imdb_id, indexable";')
          repl(p,'  const titleText = `${series.showName} S${String(ep.season).padStart(2, "0")}E${String(ep.episode).padStart(2, "0")} Sinhala Subtitle | ${episodeTitle} | PixelPopLK`;\n  const descText = `Download Sinhala subtitle for ${series.showName} S${ep.season}E${ep.episode} (${episodeTitle}). High-quality Sinhala sub file synced on PixelPopLK.`;\n  const keywordText = `${series.showName} S${ep.season}E${ep.episode} Sinhala Subtitle, ${series.showName} Season ${ep.season} Episode ${ep.episode} Sinhala Subtitle, Sinhala Subtitles TV Series, PixelPopLK, Sinhala Subtitles`;\n  const canonicalUrl = `${BASE_URL}/episode/${ep.id}`;','  const titleText = ep.seo_title?.trim() || `${series.showName} S${String(ep.season).padStart(2, "0")}E${String(ep.episode).padStart(2, "0")} Sinhala Subtitle | ${episodeTitle} | PixelPopLK`;\n  const descText = ep.seo_description?.trim() || (ep.description?.trim() || `Download Sinhala subtitle for ${series.showName} S${ep.season}E${ep.episode} (${episodeTitle}). High-quality Sinhala subtitle file synced on PixelPopLK.`);\n  const canonicalUrl = ep.canonical_url?.trim() || `${BASE_URL}/episode/${ep.slug || ep.id}`;\n  const indexable = ep.indexable !== false;')
          repl(p,'      { name: "keywords", content: keywordText },\n      { name: "robots", content: "index, follow" },','      { name: "robots", content: indexable ? "index, follow" : "noindex, follow" },')
          repl(p,'''    ...(rating\n      ? {\n          "aggregateRating": {\n            "@type": "AggregateRating",\n            "ratingValue": String(rating),\n            "bestRating": "10",\n            "worstRating": "1",\n            "ratingCount": "1",\n            "description": "IMDb rating sourced from public data"\n          }\n        }\n      : {}),\n''','')
          repl(p,'    "description": ep.description || `Sinhala subtitle for ${series.showName} Season ${ep.season} Episode ${ep.episode}`,','    "description": ep.seo_description?.trim() || ep.description || `Sinhala subtitle for ${series.showName} Season ${ep.season} Episode ${ep.episode}`,')
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/seo-admin-patch.yml
          git add src/routes/manage-admin.tsx src/routes/content.$id.tsx src/routes/episode.$id.tsx .github/workflows/seo-admin-patch.yml
          git commit -m "SEO: add admin controls and clean content metadata"
          git push origin HEAD:pixelpopgpt
