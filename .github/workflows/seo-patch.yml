name: SEO patch

on:
  push:
    branches:
      - pixelpopgpt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixelpopgpt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply SEO fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in pairs:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)

          replace('src/routes/__root.tsx', [
              ('      { name: "keywords", content: "Sinhala Subtitles, Download Movie Subtitles, PixelPopLK, Sinhala Subtitles TV Series, subtitle download, sri lanka subtitles" },\n', ''),
              ('      { property: "og:image", content: "https://pixelpoplk.pages.dev/og-banner.png" },', '      { property: "og:image", content: "https://pixelpoplk.pages.dev/og-banner.jpg" },'),
              ('      { name: "twitter:image", content: "https://pixelpoplk.pages.dev/og-banner.png" },', '      { name: "twitter:image", content: "https://pixelpoplk.pages.dev/og-banner.jpg" },'),
          ])

          replace('src/routes/index.tsx', [
              ('      { name: "keywords", content: "Sinhala Subtitles, Download Movie Subtitles, PixelPopLK, Sinhala Subtitles TV Series, subtitle download, sri lanka subtitles" },\n', ''),
              ('      { property: "og:image", content: "https://pixelpoplk.pages.dev/og-banner.png" },', '      { property: "og:image", content: "https://pixelpoplk.pages.dev/og-banner.jpg" },'),
              ('      { name: "twitter:image", content: "https://pixelpoplk.pages.dev/og-banner.png" },', '      { name: "twitter:image", content: "https://pixelpoplk.pages.dev/og-banner.jpg" },'),
          ])

          p = Path('src/routes/content.$id.tsx')
          s = p.read_text()
          s = re.sub(r'\n\s*\{ name: "keywords", content: keywordText \},', '', s)
          s = re.sub(r'\n\s*\{ name: "keywords", content: keywordText \},', '', s)
          s = re.sub(r'\n\s*\/\/ 🟢 SEO Tags Cloud\n\s*<SeoTagsCloud[\s\S]*?\/>', '', s)
          s = re.sub(r'\n\s*const customMeta = [\s\S]*?;\n\s*const keywordText = [\s\S]*?;\n', '\n', s, count=2)
          p.write_text(s)
          PY
      - name: Commit SEO fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/__root.tsx src/routes/index.tsx src/routes/content.$id.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(seo): remove keyword stuffing and repair social image URLs"
          git push origin pixelpopgpt
