<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Watch sponsor ad · PixelPop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0e0e12; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { width: min(100% - 2rem, 28rem); padding: 2rem 1.5rem; border: 1px solid #30303a; border-radius: 1rem; background: #17171e; }
    p { color: #b8b8c2; }
    button { width: 100%; margin-top: 1rem; padding: .9rem 1rem; border: 0; border-radius: .7rem; background: #667eea; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 3rem; }
    .ad-slot { display:flex; flex-direction:column; align-items:center; gap:.35rem; margin:1rem auto; }
    .ad-label { color:#888895; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
    .ad-frame { display:flex; align-items:center; justify-content:center; max-width:100%; overflow:hidden; background:#111116; }
    .ad-rectangle { width:300px; min-height:250px; }
    .ad-tall { width:160px; min-height:300px; }
    .ad-frame iframe { max-width:100%; border:0; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Watch sponsor ad</h1>
    <p id="message">Tap to open the sponsor link, visit it, then return to this page. Files are never requested automatically.</p>
    <button id="start" type="button">Open sponsor link</button>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="ad-slot" aria-label="Advertisement">
      <span class="ad-label">Advertisement</span>
      <div class="ad-frame ad-rectangle">
        <script>
          atOptions = {
            'key' : '9dd5c8b0fb237459ed96d9d5952c404d',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://acorntar.com/9dd5c8b0fb237459ed96d9d5952c404d/invoke.js"></script>
      </div>
    </section>
    <section class="ad-slot" aria-label="Advertisement">
      <span class="ad-label">Advertisement</span>
      <div class="ad-frame ad-tall">
        <script>
          atOptions = {
            'key' : '399fab0da57ef47c78efa4bbf8625b8b',
            'format' : 'iframe',
            'height' : 300,
            'width' : 160,
            'params' : {}
          };
        </script>
        <script src="https://acorntar.com/399fab0da57ef47c78efa4bbf8625b8b/invoke.js"></script>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";
      const AD_URL = "https://acorntar.com/dk4nenmww6?key=f4402d71c88bddbb0bd00cf797e858e9";
      const WORKER_URL = "https://pixelbot.pasindumadusanka348.workers.dev";
      const params = new URLSearchParams(window.location.search);
      const userId = params.get("u") || params.get("a");
      const token = params.get("t");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const status = document.getElementById("status");
      const button = document.getElementById("start");

      if (!userId || !token) {
        title.textContent = "Invalid or expired download link";
        message.textContent = "Return to the bot and request a fresh download link.";
        button.hidden = true;
        return;
      }

      const endpoint = (path) => {
        const url = new URL(path, WORKER_URL);
        url.searchParams.set("u", userId);
        url.searchParams.set("t", token);
        return url.toString();
      };

      let started = false;
      let leftPage = false;
      let returnedFromAd = false;
      let verifyReady = false;
      let verifying = false;
      let startedAt = 0;
      let timer = null;

      const refreshButton = () => {
        if (verifying) return;
        if (!started) {
          button.disabled = false;
          button.textContent = "Open sponsor link";
          return;
        }
        if (!returnedFromAd) {
          button.disabled = true;
          button.textContent = "Open the sponsor link, then return here";
          status.textContent = "No file request is sent automatically. Return to this tab after visiting the sponsor page.";
          return;
        }
        const remaining = Math.max(0, 5000 - (Date.now() - startedAt));
        if (remaining > 0) {
          button.disabled = true;
          button.textContent = "Wait " + Math.ceil(remaining / 1000) + " seconds";
          status.textContent = "Please keep this page open until the minimum wait has passed.";
          return;
        }
        verifyReady = true;
        button.disabled = false;
        button.textContent = "Verify & Get Files";
        status.textContent = "Ready. Press the button to request delivery in Telegram.";
      };

      const noteReturned = () => {
        if (!started || !leftPage || document.visibilityState !== "visible") return;
        returnedFromAd = true;
        title.textContent = "Welcome back";
        message.textContent = "Press Verify & Get Files to request delivery. The page will not request files automatically.";
        refreshButton();
      };

      if (document.visibilityState === "visible") {
        status.textContent = "Open the sponsor link, visit it, then return to this page.";
      }
      window.addEventListener("blur", () => {
        if (started) leftPage = true;
      });
      window.addEventListener("focus", noteReturned);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          if (started) leftPage = true;
          // Never request /verify from a visibility or unload event.
          return;
        }
        noteReturned();
        refreshButton();
      });
      window.addEventListener("pagehide", () => {
        if (timer !== null) clearInterval(timer);
        timer = null;
        // Intentionally do not call /verify when leaving the page.
      });

      button.addEventListener("click", async () => {
        if (verifying || document.visibilityState !== "visible") return;

        if (!started) {
          // Open from the click handler to avoid popup blockers. No files are requested here.
          const adWindow = window.open(AD_URL, "_blank");
          if (!adWindow) {
            status.textContent = "Your browser blocked the sponsor tab. Allow pop-ups and tap again.";
            return;
          }
          try { adWindow.opener = null; } catch (_) {}
          started = true;
          startedAt = Date.now();
          button.disabled = true;
          button.textContent = "Opening sponsor link…";
          title.textContent = "Sponsor link opened";
          message.textContent = "Visit the sponsor page, then return to this tab. Files will not be requested automatically.";
          try {
            const response = await fetch(endpoint("/ad_started"), {
              method: "GET", cache: "no-store", credentials: "omit", redirect: "error"
            });
            const result = await response.json();
            if (!response.ok || result.ok !== true) throw new Error(result.error || "Could not start sponsor session.");
          } catch (_) {
            started = false;
            button.disabled = false;
            button.textContent = "Open sponsor link";
            title.textContent = "Could not start sponsor session";
            message.textContent = "Return to Telegram and open a fresh download link.";
            status.textContent = "The bot has not been asked to send files.";
            return;
          }
          timer = setInterval(() => {
            if (document.visibilityState === "visible") refreshButton();
          }, 500);
          refreshButton();
          return;
        }

        if (!returnedFromAd) {
          status.textContent = "Visit the sponsor page and return to this tab before verifying.";
          return;
        }
        if (!verifyReady) {
          refreshButton();
          return;
        }

        verifying = true;
        button.disabled = true;
        button.textContent = "Checking…";
        title.textContent = "Checking your download…";
        status.textContent = "The file request is being sent because you pressed Verify & Get Files.";
        try {
          let result = null;
          for (let attempt = 0; attempt < 15; attempt++) {
            if (document.visibilityState !== "visible") {
              throw new Error("Page left");
            }
            const response = await fetch(endpoint("/verify"), {
              method: "GET", cache: "no-store", credentials: "omit", redirect: "error"
            });
            result = await response.json();
            if (response.status === 425 && result.status === "waiting") {
              title.textContent = "Please wait a little longer";
              message.textContent = "The server has not reached the minimum wait yet. Return and press Verify again.";
              status.textContent = "Wait " + Number(result.remaining_seconds || 1) + " more second(s).";
              verifying = false;
              button.disabled = false;
              button.textContent = "Verify & Get Files";
              return;
            }
            if (!response.ok || result.ok !== true) throw new Error(result.error || "Verification failed.");
            if (result.status !== "processing") break;
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          if (result && (result.status === "delivered" || result.status === "already_delivered")) {
            title.textContent = "All done!";
            message.textContent = "Return to Telegram and check your chat for the files.";
            status.textContent = "The bot confirmed delivery.";
            button.hidden = true;
          } else if (result && result.status === "processing") {
            title.textContent = "Delivery is still processing";
            message.textContent = "Check Telegram. If the files do not arrive, use Retry in the bot.";
            status.textContent = "No further checks will be sent automatically.";
            verifying = false;
            button.disabled = false;
            button.textContent = "Check delivery again";
            verifyReady = true;
          } else {
            throw new Error("Delivery was not confirmed.");
          }
        } catch (_) {
          title.textContent = "Could not confirm delivery";
          message.textContent = "Return to Telegram and use Retry if the files do not arrive.";
          status.textContent = "Delivery was not assumed to be successful.";
          verifying = false;
          button.disabled = false;
          button.textContent = "Try verification again";
          verifyReady = true;
        } finally {
          if (timer !== null && button.hidden) clearInterval(timer);
          if (!button.hidden) refreshButton();
        }
      });
    })();
  </script>
</body>
</html>
