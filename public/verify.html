<!DOCTYPE html>
<html lang="si" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Sponsor Ad...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0e0e12;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e1e24;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { margin-top: 20px; font-size: 18px; font-weight: 600; }
    p { color: #94a3b8; font-size: 14px; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <h3>Redirecting to Sponsor Ad...</h3>
  <p>Please wait, you will be redirected automatically.</p>

  <script>
    // ඔයාගේ Adsterra Smart Link එක
    const AD_URL = "https://acorntar.com/dk4nenmww6?key=f4402d71c88bddbb0bd00cf797e858e9";
    
    // Cloudflare Worker Bot URL එක (අපි හදන එක)
    const WORKER_URL = "https://pixelbot.pasindumadusanka348.workers.dev/";

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('a');

    const redirectToAd = () => {
      window.location.replace(AD_URL);
    };

    if (userId) {
      // 1. Worker එකට Verification Signal එක යවනවා
      fetch(`${WORKER_URL}/verify?a=${userId}`, { keepalive: true })
        .catch(err => console.error(err))
        .finally(() => {
          // 2. තත්පරයකින් කෙලින්ම Adsterra Ad එකට යවනවා
          setTimeout(redirectToAd, 800);
        });
    } else {
      redirectToAd();
    }
  </script>
</body>
</html>
