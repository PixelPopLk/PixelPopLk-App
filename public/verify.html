<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Watch sponsor ad · PixelPop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0e0e12; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { width: min(100% - 2rem, 28rem); padding: 2rem 1.5rem; border: 1px solid #30303a; border-radius: 1rem; background: #17171e; }
    p { color: #b8b8c2; }
    button { width: 100%; margin-top: 1rem; padding: .9rem 1rem; border: 0; border-radius: .7rem; background: #667eea; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 3rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Watch sponsor ad</h1>
    <p id="message">Tap the button to open the sponsor ad. Keep this page open; after 5 seconds, your files will be sent automatically.</p>
    <button id="start" type="button">Open Ad & Start 5-Second Timer</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      "use strict";
      const AD_URL = "https://acorntar.com/dk4nenmww6?key=f4402d71c88bddbb0bd00cf797e858e9";
      const WORKER_URL = "https://pixelbot.pasindumadusanka348.workers.dev";
      const params = new URLSearchParams(window.location.search);
      const userId = params.get("u") || params.get("a");
      const token = params.get("t");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const status = document.getElementById("status");
      const button = document.getElementById("start");

      if (!userId || !token) {
        title.textContent = "Invalid or expired download link";
        message.textContent = "Return to the bot and request a fresh download link.";
        button.hidden = true;
        return;
      }

      const endpoint = (path) => {
        const url = new URL(path, WORKER_URL);
        url.searchParams.set("u", userId);
        url.searchParams.set("t", token);
        return url.toString();
      };

      let started = false;
      button.addEventListener("click", async () => {
        if (started) return;
        // Open directly in the click handler so mobile browsers are less likely to block it.
        // Do not pass "noopener" to window.open: browsers may then return null even
        // when the tab opened, which previously prevented /ad_started from being called.
        const adWindow = window.open(AD_URL, "_blank");
        if (!adWindow) {
          status.textContent = "Your browser blocked the ad tab. Allow pop-ups for this page and tap again.";
          return;
        }
        // Keep the new tab isolated without triggering the false-negative above.
        try { adWindow.opener = null; } catch (_) {}

        started = true;
        button.disabled = true;
        title.textContent = "Sponsor ad opened";
        let response;
        try {
          response = await fetch(endpoint("/ad_started"), {
            method: "GET", cache: "no-store", credentials: "omit", redirect: "error"
          });
          const result = await response.json();
          if (!response.ok || result.ok !== true) throw new Error(result.error || "Could not start verification.");
        } catch (_) {
          title.textContent = "Could not start download";
          message.textContent = "Return to the bot and open a fresh download link.";
          status.textContent = "The download session could not be verified.";
          started = false;
          button.disabled = false;
          return;
        }

        for (let remaining = 5; remaining > 0; remaining--) {
          status.textContent = "Sending files automatically in " + remaining + " second" + (remaining === 1 ? "" : "s") + "…";
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }

        title.textContent = "Sending your files…";
        status.textContent = "Please keep this page open while the bot sends your files.";
        try {
          // Server independently enforces the five-second minimum and single-use token.
          let result = null;
          // A concurrent delivery request can briefly return "processing". Poll the
          // server so this page does not announce completion before files are sent.
          for (let attempt = 0; attempt < 15; attempt++) {
            const verifyResponse = await fetch(endpoint("/verify"), {
              method: "GET", cache: "no-store", credentials: "omit", redirect: "error"
            });
            result = await verifyResponse.json();
            if (!verifyResponse.ok || result.ok !== true) {
              throw new Error(result.error || "Verification failed.");
            }
            if (result.status !== "processing") break;
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          if (result && (result.status === "delivered" || result.status === "already_delivered")) {
            title.textContent = "All done!";
            message.textContent = "Return to Telegram and check your chat for the files.";
            status.textContent = "Your files have been sent to Telegram.";
            button.hidden = true;
          } else {
            title.textContent = "Delivery is taking longer than expected";
            message.textContent = "Return to Telegram and tap Retry on the download message if files do not arrive.";
            status.textContent = "The bot is still processing the request. Check Telegram, then use Retry if needed.";
          }
        } catch (_) {
          title.textContent = "Automatic delivery did not finish";
          message.textContent = "Return to Telegram and tap the Retry button on the download message.";
          status.textContent = "If the files do not arrive, use Retry in the bot.";
          button.hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
