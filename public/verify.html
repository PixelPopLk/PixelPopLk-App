<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const AD_URL = "https://acorntar.com/dk4nenmww6?key=f4402d71c88bddbb0bd00cf797e858e9";
    const WORKER_URL = "https://pixelbot.pasindumadusanka348.workers.dev";

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('a');

    if (userId) {
      // Background එකෙන් Worker එකට වෙලාව සටහන් කිරීමට Signal එක යවයි (Zero Delay)
      if (navigator.sendBeacon) {
        navigator.sendBeacon(`${WORKER_URL}/ad_started?a=${userId}`);
      } else {
        fetch(`${WORKER_URL}/ad_started?a=${userId}`, { keepalive: true }).catch(() => {});
      }
    }

    // ඇසිපිය ගහන සැනින් (Instant 0.05s) Ad එකට Redirect වීම!
    window.location.replace(AD_URL);
  </script>
</head>
<body style="background:#0e0e12;margin:0;"></body>
</html>
